{% load static %}
<ul class="project-list">
  {% for entry in entries %}
    <li>
      <a class="project-row" href="{% url 'project-detail' entry.slug %}">
        <img class="entry-logo" src="{% static entry.logo %}" width="42" height="42" loading="lazy" alt="">
        <div class="entry-copy">
          <h3>{{ entry.name }}</h3>
          <p>{{ entry.description }}</p>
        </div>
        <span aria-hidden="true">&rarr;</span>
      </a>
    </li>
  {% endfor %}
</ul>
