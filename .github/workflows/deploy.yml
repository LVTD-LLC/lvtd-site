name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/lvtd-llc/lvtd-site

jobs:
  deploy:
    name: Build and deploy web and workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build --tag "$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$IMAGE_NAME:$GITHUB_SHA"

      - name: Deploy web app
        uses: caprover/deploy-from-github@main
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: lvtd-site
          token: ${{ secrets.CAPROVER_TOKEN_LVTD_SITE }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy workers
        uses: caprover/deploy-from-github@main
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: lvtd-site-workers
          token: ${{ secrets.CAPROVER_TOKEN_LVTD_SITE_WORKERS }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
