# Included in the lvtd-site CapRover server block. Only Django may select it.
location @lvtd_games {
    set $games_upstream http://srv-captain--games:80;
    proxy_pass $games_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "lvtd_bs_session=$cookie_lvtd_bs_session; lvtd_jess_player=$cookie_lvtd_jess_player";
    proxy_ignore_headers X-Accel-Redirect;
}
